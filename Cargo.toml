[package]
name = "cos-ssd"
version = "1.5.20"
edition = "2024"
authors = ["ekahPruthvi <ekahpdp@gmail.com>"]
description = "Display Server-Side Decorations for COS"
license = "GPL-3.0"
repository = "https://github.com/ekahPruthvi/altDotlauncher.git"

[dependencies]
chrono = "0.4.45"
gtk4 = "0.11.5"
gtk4-layer-shell = "0.8.1"
infoprober = "0.1.0"
libc = "0.2.191"
niri-ipc = "26.4.0"
self_update = "1.3.3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
debug = false
incremental = false
overflow-checks = false
debug-assertions = false